# Reverse proxy for e-AVEC on the McBuleli VPS.
# Canonical copy lives in https://github.com/Jeffbuleli/avec (ops/vps/nginx-e-avec.conf).
# App: 127.0.0.1:3001 — same Postgres as McBuleli.

upstream eavec_web {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name e-avec.org www.e-avec.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://e-avec.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.e-avec.org;

  ssl_certificate /etc/letsencrypt/live/e-avec.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/e-avec.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  return 301 https://e-avec.org$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name e-avec.org;

  ssl_certificate /etc/letsencrypt/live/e-avec.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/e-avec.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 25m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  location / {
    proxy_pass http://eavec_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $mcb_client_ip;
    proxy_set_header X-Forwarded-For $mcb_client_ip;
    proxy_set_header CF-Connecting-IP $mcb_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 120s;
  }
}
