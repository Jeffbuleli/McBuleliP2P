# remix.mcbuleli.org — Remix IDE privé (ops McBuleli)
# Place under /etc/nginx/sites-available/remix.mcbuleli.org
# Requires:
#   - Docker remix on 127.0.0.1:8080 (ops/vps/remix/docker-compose.yml)
#   - Basic auth file: /etc/nginx/.htpasswd-remix
#   - TLS certs (certbot or existing /etc/ssl/mcbuleli/)
#
# MetaMask exige HTTPS sur domaine custom — ne pas servir Remix en HTTP public.

upstream mcbuleli_remix {
  server 127.0.0.1:8080;
  keepalive 8;
}

server {
  listen 80;
  listen [::]:80;
  server_name remix.mcbuleli.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://remix.mcbuleli.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name remix.mcbuleli.org;

  # Prefer dedicated cert ; fallback pattern matches mcbuleli.org if SAN includes remix
  ssl_certificate     /etc/ssl/mcbuleli/fullchain.pem;
  ssl_certificate_key /etc/ssl/mcbuleli/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # Ops only — never leave Remix open without auth
  auth_basic           "McBuleli Remix (ops)";
  auth_basic_user_file /etc/nginx/.htpasswd-remix;

  # Remix is a SPA with large assets
  client_max_body_size 32m;

  location / {
    proxy_pass http://mcbuleli_remix;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }
}
