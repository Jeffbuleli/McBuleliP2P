name: Deploy VPS (from GitHub)

# Prod deploys ONLY from GitHub main - not from laptop rsync.
# Secrets (Settings → Secrets → Actions):
#   VPS_HOST          Prod McBuleli: 153.75.235.176 (see docs/vps-production-host.md). Migration target: 162.35.181.98 — not prod origin today.
#   VPS_USER          e.g. root
#   VPS_SSH_KEY       private key with deploy access
# Optional:
#   VPS_REPO_DIR      default /opt/mcbuleli

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mcbuleli-deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Deploy via SSH (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail
            REPO="${{ secrets.VPS_REPO_DIR }}"
            REPO="${REPO:-/opt/mcbuleli}"
            if [[ ! -d "$REPO/.git" ]]; then
              if [[ -e "$REPO" ]] && [[ -n "$(ls -A "$REPO" 2>/dev/null || true)" ]]; then
                echo "ERROR: $REPO exists but is not a git checkout (fix on VPS or set VPS_REPO_DIR)." >&2
                exit 1
              fi
              mkdir -p "$(dirname "$REPO")"
              git clone --depth 1 -b main https://github.com/Jeffbuleli/McBuleliP2P.git "$REPO"
            fi
            if [[ ! -f "$REPO/ops/vps/deploy.sh" ]]; then
              echo "ERROR: $REPO missing ops/vps/deploy.sh after clone" >&2
              exit 1
            fi
            chmod +x "$REPO/ops/vps/deploy.sh" || true
            bash "$REPO/ops/vps/deploy.sh"
            if [[ -x "$REPO/ops/vps/seed-nov26-formation.sh" ]]; then
              bash "$REPO/ops/vps/seed-nov26-formation.sh"
            fi
