# nginx vhost - Ngemba RDC (primary) + legacy cyberalert subdomain
# Certs: /etc/letsencrypt/live/ngemba-rdc.org/ + ngemba.cyberalert-rdc.org/

upstream ngemba_web {
  server 127.0.0.1:3012;
  keepalive 16;
}

# --- ngemba-rdc.org HTTP → HTTPS ---
server {
  listen 80;
  listen [::]:80;
  server_name ngemba-rdc.org www.ngemba-rdc.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://ngemba-rdc.org$request_uri;
  }
}

# --- ngemba-rdc.org HTTPS (primary) ---
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ngemba-rdc.org www.ngemba-rdc.org;

  ssl_certificate     /etc/letsencrypt/live/ngemba-rdc.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ngemba-rdc.org/privkey.pem;

  client_max_body_size 8m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self)" always;

  if ($host = www.ngemba-rdc.org) {
    return 301 https://ngemba-rdc.org$request_uri;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://ngemba_web;
  }
}

# --- Legacy subdomain ---
server {
  listen 80;
  listen [::]:80;
  server_name ngemba.cyberalert-rdc.org;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://ngemba-rdc.org$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name ngemba.cyberalert-rdc.org;

  ssl_certificate     /etc/letsencrypt/live/ngemba.cyberalert-rdc.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ngemba.cyberalert-rdc.org/privkey.pem;

  client_max_body_size 8m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(self)" always;

  location / {
    return 301 https://ngemba-rdc.org$request_uri;
  }
}
